name: Daily snapshot

on:
  schedule:
    - cron: "41 1 * * *"   # 07:11 India, 05:41 Dubai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r snapshot/requirements.txt
      - name: Take snapshot
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python snapshot/snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name "fnb-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
