name: Build board
# One board for every site in sites/*.json, with a site switcher in the top bar.

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Checkpoint label shown in the top bar"
        default: "Checkpoint 30"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the live feeds
        run: |
          mkdir -p /tmp/live
          if git fetch --depth 1 origin live 2>/dev/null; then
            for f in sites/*.json; do
              id=$(basename "$f" .json)
              dir=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('data_dir','data'))" "$f")
              git show "FETCH_HEAD:$dir/live.json" > "/tmp/live/live-$id.json" 2>/dev/null || rm -f "/tmp/live/live-$id.json"
            done
          fi
      - name: Build
        env:
          CP: ${{ inputs.checkpoint }}
        run: |
          python -B tools/build_html.py tools/board-replica.html "FNB Performance cards.html" "$CP" charcoal /tmp/live
          cp "FNB Performance cards.html" index.html
      - name: Commit
        env:
          CP: ${{ inputs.checkpoint }}
        run: |
          git config user.name "fnb-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "FNB Performance cards.html"
          git diff --cached --quiet && exit 0
          git commit -m "Board, $CP"
          git pull --rebase
          git push
