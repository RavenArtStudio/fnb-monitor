name: Live feed

# Google Analytics Realtime for the board's 30m, 12h and 24h windows (Checkpoint 27).
# Publishes data/live.json and data/live-log.json on the `live` branch as one overwritten
# commit, so main and the repo history do not grow. The board reads
# https://raw.githubusercontent.com/RavenArtStudio/fnb-monitor/live/data/live.json

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, away from the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snapshot/requirements.txt
      - run: pip install -r snapshot/requirements.txt
      - name: Restore the live log
        run: |
          mkdir -p live
          if git fetch --depth 1 origin live 2>/dev/null; then
            git show FETCH_HEAD:data/live-log.json > live/live-log.json || rm -f live/live-log.json
          fi
      - name: Read Google Analytics Realtime
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python snapshot/live.py live
      - name: Publish to the live branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd live
          mkdir -p data
          mv live.json live-log.json data/
          git init -q -b live
          git config user.name "fnb-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -qm "Live $(date -u +%FT%RZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" live
