name: Live feed
# Google Analytics Realtime for every site in sites/*.json, every 15 minutes. Each site's files sit under its data
# folder on the live branch (data/ for FNB, data/sites/<id>/ for the others), published as one overwritten commit.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, away from the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snapshot/requirements.txt
      - run: pip install -r snapshot/requirements.txt
      - name: Read Google Analytics Realtime
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          have=0
          git fetch --depth 1 origin live 2>/dev/null && have=1
          for f in sites/*.json; do
            id=$(basename "$f" .json)
            dir=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('data_dir','data'))" "$f")
            mkdir -p "out/$dir"
            if [ "$have" = 1 ]; then
              git show "FETCH_HEAD:$dir/live-log.json" > "out/$dir/live-log.json" 2>/dev/null || rm -f "out/$dir/live-log.json"
              git show "FETCH_HEAD:$dir/live.json" > "out/$dir/live.json" 2>/dev/null || rm -f "out/$dir/live.json"
            fi
            SITE_ID=$id python snapshot/live.py "out/$dir" || echo "::warning::Live feed failed for $id"
          done
      - name: Publish to the live branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          git init -q -b live
          git config user.name "fnb-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -qm "Live $(date -u +%FT%RZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" live
